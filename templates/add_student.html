{% extends 'base.html' %}

{% block title %}Add Student - Student Exchange System{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New Student</h2>
    
    <form method="POST" action="{{ url_for('add_student') }}">
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="name" required placeholder="Enter full name">
        </div>
        
        <div class="form-group">
            <label>Department</label>
            <select name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="ENG">ENG</option>
                <option value="MATH">MATH</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>CGPA (0.00 - 4.00)</label>
            <input type="number" name="cgpa" step="0.01" min="0" max="4" required placeholder="e.g., 3.50">
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="student@aiub.edu">
        </div>
        
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="01XXXXXXXXX">
        </div>
        
        <button type="submit" class="btn btn-primary">Add Student</button>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
