{% extends 'base.html' %}

{% block title %}Student Registration - Student Exchange System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <h2 style="text-align: center;">Student Registration</h2>

        <form method="POST" action="{{ url_for('student_register') }}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Enter your full name">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Department</label>
                    <select name="department" required>
                        <option value="">Select</option>
                        <option value="CSE">CSE</option>
                        <option value="EEE">EEE</option>
                        <option value="BBA">BBA</option>
                        <option value="ENG">ENG</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" name="cgpa" step="0.01" min="0" max="4" required placeholder="0.00-4.00">
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" required placeholder="01XXXXXXXXX">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Choose Password</label>
                    <input type="password" name="password" required placeholder="Choose a password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #aaa;">Already have an account?</p>
            <a href="{{ url_for('student_login') }}" style="color: #00d4ff;">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
