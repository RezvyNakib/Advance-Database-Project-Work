{% extends 'base.html' %}

{% block title %}Student Login - Student Exchange System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #00d4ff, #7b2cbf); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">S</div>
            <h2>Student Login</h2>
            <p style="color: #aaa;">Login to apply for exchange programs</p>
        </div>

        <form method="POST" action="{{ url_for('student_login') }}">
            <input type="hidden" name="role" value="student">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #aaa;">Don't have an account?</p>
            <a href="{{ url_for('student_register') }}" class="btn btn-primary" style="margin-top: 0.5rem;">Register as Student</a>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('home') }}" style="color: #00d4ff;">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
