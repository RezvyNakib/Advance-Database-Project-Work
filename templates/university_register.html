{% extends 'base.html' %}

{% block title %}University Registration - Student Exchange System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #ffc107, #fd7e14); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #333;">U</div>
            <h2>University Registration</h2>
            <p style="color: #aaa;">Register your university</p>
        </div>

        <form method="POST" action="{{ url_for('university_register') }}">
            <div class="form-group">
                <label>University Name</label>
                <input type="text" name="uni_name" required placeholder="e.g., American International University">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country" required placeholder="e.g., Bangladesh">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="Full address">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Choose Password</label>
                    <input type="password" name="password" required placeholder="Choose a password">
                </div>
            </div>

            <button type="submit" class="btn btn-warning" style="width: 100%; color: #333;">Register</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #aaa;">Already have an account?</p>
            <a href="{{ url_for('university_login') }}" style="color: #00d4ff;">Login here</a>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('home') }}" style="color: #00d4ff;">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
