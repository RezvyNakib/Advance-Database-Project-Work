{% extends 'base.html' %}

{% block title %}Login - Student Exchange System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <h2 style="text-align: center;">Login</h2>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label>Select Role</label>
                <select name="role" required>
                    <option value="student">Student</option>
                    <option value="coordinator">Coordinator</option>
                    <option value="university">University</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #aaa;">Are you a new student?</p>
            <a href="{{ url_for('student_register') }}" class="btn btn-primary" style="margin-top: 0.5rem;">Register as Student</a>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('home') }}" style="color: #00d4ff;">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
