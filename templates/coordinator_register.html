{% extends 'base.html' %}

{% block title %}Coordinator Registration - Student Exchange System{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #28a745, #20c997); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem;">C</div>
            <h2>Coordinator Registration</h2>
            <p style="color: #aaa;">Register as a program coordinator</p>
        </div>

        <form method="POST" action="{{ url_for('coordinator_register') }}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Dr. Your Name">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="email@university.edu">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" required placeholder="+1-xxx-xxx-xxxx">
                </div>
            </div>

            <div class="form-group">
                <label>Assign to University</label>
                <select name="uni_id" required>
                    <option value="">Select University</option>
                    {% for uni in universities %}
                    <option value="{{ uni[0] }}">{{ uni[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Choose Password</label>
                    <input type="password" name="password" required placeholder="Choose a password">
                </div>
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%;">Register</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #aaa;">Already have an account?</p>
            <a href="{{ url_for('coordinator_login') }}" style="color: #00d4ff;">Login here</a>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('home') }}" style="color: #00d4ff;">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
