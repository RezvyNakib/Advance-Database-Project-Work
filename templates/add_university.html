{% extends 'base.html' %}

{% block title %}Add University - Student Exchange System{% endblock %}

{% block content %}
<div class="card">
    <h2>Add New University</h2>
    
    <form method="POST" action="{{ url_for('add_university') }}">
        <div class="form-group">
            <label>University Name</label>
            <input type="text" name="name" required placeholder="e.g., University of Toronto">
        </div>
        
        <div class="form-group">
            <label>Country</label>
            <input type="text" name="country" required placeholder="e.g., Canada">
        </div>
        
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" placeholder="Full address">
        </div>
        
        <button type="submit" class="btn btn-primary">Add University</button>
        <a href="{{ url_for('university_dashboard') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
