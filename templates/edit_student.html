{% extends 'base.html' %}

{% block title %}Edit Student - Student Exchange System{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Student</h2>
    
    <form method="POST" action="{{ url_for('edit_student', id=student[0]) }}">
        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="name" value="{{ student[1] }}" required>
        </div>
        
        <div class="form-group">
            <label>Department</label>
            <select name="department" required>
                <option value="CSE" {% if student[2] == 'CSE' %}selected{% endif %}>CSE</option>
                <option value="EEE" {% if student[2] == 'EEE' %}selected{% endif %}>EEE</option>
                <option value="BBA" {% if student[2] == 'BBA' %}selected{% endif %}>BBA</option>
                <option value="ENG" {% if student[2] == 'ENG' %}selected{% endif %}>ENG</option>
                <option value="MATH" {% if student[2] == 'MATH' %}selected{% endif %}>MATH</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>CGPA (0.00 - 4.00)</label>
            <input type="number" name="cgpa" step="0.01" min="0" max="4" value="{{ student[3] }}" required>
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ student[4] }}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Update Student</button>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-danger">Cancel</a>
    </form>
</div>
{% endblock %}
